name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and Mosquitto
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y mosquitto
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Test MQTT recovery
        run: |
          # Ubuntu confines Mosquitto config reads to /etc/mosquitto.
          demo_tmp=$(sudo mktemp -d /etc/mosquitto/conf.d/iot-gateway-ci.XXXXXX)
          trap "sudo rmdir -- \"$demo_tmp\"" EXIT
          sudo chown "$(id -u):$(id -g)" "$demo_tmp"
          TMPDIR="$demo_tmp" python3 scripts/demo.py
